<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SVG бегунок по кругу</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f7f9fc;
  }

  svg {
    overflow: visible;
  }

  .rot {
    transform-origin: 50px 50px; /* центр вращения круга */
    animation: spin 2s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>
</head>
<body>

<svg width="200" height="200" viewBox="0 0 100 100">
  <!-- Серый круг -->
  <circle
    cx="50"
    cy="50"
    r="40"
    stroke="#ccd1cd"
    stroke-width="4"
    fill="none"
  />

  <!-- Группа с анимацией -->
  <g class="rot">
    <!-- Бегунок (маленький квадрат) -->
    <rect
      x="49"
      y="9"
      width="2"
      height="2"
      fill="purple"
      rx="0.5"
      ry="0.5"
    />
  </g>
</svg>

</body>
</html>
