<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="/css/style.css" />
    <title>Ozon</title>
  </head>
  <body>
    <div class="main">
        <div class="wraper">
      <div class="progress">
        <div class="progress__title">
          <p>Progress</p>
        </div>
<div class="progress__circle">
<svg width="126" height="126" viewBox="0 0 126 126" fill="none">
  <defs>
    <!-- Градиент бегунка -->
    <linearGradient id="knobGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3937FF" />
      <stop offset="60%" stop-color="#8C8BFF" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
  </defs>

  <!-- Серый круг -->
  <circle
    cx="63"
    cy="63"
    r="60"
    stroke="#CFD2CF"
    stroke-width="6"
    fill="none"
  />

  <!-- Основной прогресс -->
  <circle
    class="progress__arc"
    cx="63"
    cy="63"
    r="60"
    stroke="#3937FF"
    stroke-width="6"
    fill="none"
    stroke-dasharray="377"
    stroke-dashoffset="377"
    stroke-linecap="round"
    transform="rotate(-90 63 63)"
  />

  <g class="knob-rot">

    <circle
      class="progress__tail"
      cx="63"
      cy="63"
      r="60"
      stroke="#3788ff"
      stroke-width="6"
      stroke-linecap="round"
      stroke-dasharray="18.8 358.2" 
      transform="rotate(-90 63 63)"
    />
  </g>
</svg>

</div>


        
    </div>
    
    <div class="panel">
      <div class="panel__controls">
        <div class="control control--value">
          <input class="control__input" type="text" id="value-input" />
          <div class="control__subtitle">Value</div>
        </div>
        
        <div class="control ">
          <input class="control__input control__input--animate" type="checkbox" id="animate-toggle" />
          <label for="animate-toggle" class="control__toggle"></label>
          <div class="control__subtitle">Animate</div>
        </div>
        
        <div class="control control--value">
          <input class="control__input" type="checkbox" id="hide-toggle" />
          <label for="hide-toggle" class="control__toggle"></label>
          <div class="control__subtitle">Hide</div>
        </div>
      </div>
    </div>
  </div>
  </div>
</body>
<script src="scripts/main.js"></script>
</html>
